name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # Pinned so that a new "ubuntu-latest" cannot change the toolchain under our feet.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.13 is the minimum supported version: it is what Proxmox VE 9 (Debian 13) ships.
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
