name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the VERSION file
        run: |
          if [ "v$(tr -d '[:space:]' < VERSION)" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ($(cat VERSION))" >&2
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            index($0, "## [") == 1 { found = 0 }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No notes for $version in CHANGELOG.md" >&2; exit 1; fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md
